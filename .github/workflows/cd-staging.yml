name: CD Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy to staging (e.g. v0.18.2)"
        required: true

permissions:
  contents: read

env:
  CR_REGISTRY: cr.yandex/${{ secrets.YC_CR_REGISTRY_ID }}
  IMAGE_NAME: vkuswill-bot
  DEPLOY_USER: deploy
  DEPLOY_DIR: /opt/vkuswill-bot-stg

jobs:
  test:
    name: Pre-deploy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run pytest -x -q --tb=short

  build-and-push:
    name: Build & Push to Yandex CR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - uses: actions/checkout@v6

      - name: Extract tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${CR_REGISTRY}/${IMAGE_NAME}:${TAG}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_CR_KEY_SECRET }}' | \
            docker login cr.yandex \
              --username json_key \
              --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}

  deploy:
    name: Deploy to Staging VM
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - uses: actions/checkout@v6

      - name: Validate required staging secrets
        env:
          _VM_HOST_STG: ${{ secrets.VM_HOST_STG }}
          _VM_SSH_KEY_STG: ${{ secrets.VM_SSH_KEY_STG }}
          _LOCKBOX_SECRET_ID_STG: ${{ secrets.LOCKBOX_SECRET_ID_STG }}
          _YC_CR_REGISTRY_ID: ${{ secrets.YC_CR_REGISTRY_ID }}
          _YC_CR_KEY_SECRET: ${{ secrets.YC_CR_KEY_SECRET }}
        run: |
          MISSING=0
          for name in _VM_HOST_STG _VM_SSH_KEY_STG _LOCKBOX_SECRET_ID_STG _YC_CR_REGISTRY_ID _YC_CR_KEY_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret is empty: ${name#_}"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

      - name: Validate staging deploy guard
        run: |
          bash scripts/check_staging_deploy_guard.sh
          bash deploy/deploy-staging.sh --validate-only

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY_STG }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST_STG }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare staging deploy directory
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.VM_HOST_STG }}" \
            "sudo mkdir -p '${{ env.DEPLOY_DIR }}' && sudo chown -R '${{ env.DEPLOY_USER }}':'${{ env.DEPLOY_USER }}' '${{ env.DEPLOY_DIR }}'"

      - name: Sync deploy assets
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/deploy.sh \
            deploy/deploy-staging.sh \
            deploy/nginx-bot.conf \
            deploy/setup-ssl.sh \
            deploy/setup-selfsigned-ssl.sh \
            "${{ env.DEPLOY_USER }}@${{ secrets.VM_HOST_STG }}:${{ env.DEPLOY_DIR }}/"

      - name: Docker login on VM
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.VM_HOST_STG }}" \
            "rm -f ~/.docker/config.json" 2>/dev/null || true
          echo '${{ secrets.YC_CR_KEY_SECRET }}' | \
            ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.VM_HOST_STG }}" \
            "docker login cr.yandex --username json_key --password-stdin"

      - name: Run staging deploy
        run: |
          FULL_IMAGE="${{ env.CR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.VM_HOST_STG }}" \
            "bash ${{ env.DEPLOY_DIR }}/deploy-staging.sh --image '${FULL_IMAGE}' --tag '${{ needs.build-and-push.outputs.image_tag }}' --lockbox '${{ secrets.LOCKBOX_SECRET_ID_STG }}' --model 'GigaChat-2-Max'"

      - name: Health check (staging)
        timeout-minutes: 3
        run: |
          sleep 20
          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.VM_HOST_STG }}" \
            "set -euo pipefail; \
             HTTP_URL='http://127.0.0.1:18080/health'; \
             echo \"Health check URL: \${HTTP_URL}\"; \
             for i in 1 2 3 4 5; do \
               STATUS=\$(curl -s --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' \"\${HTTP_URL}\" 2>/dev/null || true); \
               if [ \"\${STATUS}\" = '200' ]; then \
                 echo \"Health check OK (attempt \${i})\"; \
                 exit 0; \
               fi; \
               echo \"Attempt \${i}: status=\${STATUS}, retrying in 10s...\"; \
               sleep 10; \
             done; \
             echo 'Health check failed'; \
             exit 1"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
