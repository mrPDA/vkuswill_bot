title = "vkuswill-bot gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Example placeholders in docs and templates"
paths = [
  '''^\.env\.example$''',
  '''^README\.md$''',
  '''^CONTRIBUTING\.md$''',
  '''^infra/terraform\.tfvars\.example$''',
]
regexes = [
  '''(?i)your_telegram_bot_token''',
  '''(?i)your_gigachat_auth_key''',
  '''(?i)change_me_[a-z0-9_]+''',
  '''123456:ABC-DEF\.\.\.''',
]

[[allowlists]]
description = "Test-only synthetic credentials"
paths = [
  '''^tests/test_config_security\.py$''',
]
regexes = [
  '''AKIA_TEST''',
  '''123456789:ABCdefGHIjklMNOpqrsTUVwxyz''',
]

[[allowlists]]
description = "Public certificate bundles"
paths = [
  '''^certs/.*''',
  '''^docs/cert/.*''',
]

[[allowlists]]
description = "Placeholder curl examples in docs"
regexes = [
  '''pk-lf-\.\.\.:sk-lf-\.\.\.''',
  '''pk-lf-YOUR_PUBLIC_KEY:sk-lf-YOUR_SECRET_KEY''',
  '''pk-lf-PUBLIC:sk-lf-SECRET''',
  '''pk-lf-REDACTED:sk-lf-REDACTED''',
  '''PUBLIC_KEY:SECRET_KEY''',
]

[[allowlists]]
description = "curl-auth-user false positives in Langfuse docs (placeholder curl examples, no real credentials)"
commits = [
  "e4524c1176b32905498ce3927ac467a41491c1f0",
]

# Кастомные правила для обнаружения Langfuse API-ключей (self-hosted и cloud)
[[rules]]
id = "langfuse-public-key"
description = "Langfuse Public API Key"
regex = '''pk-lf-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
tags = ["api-key", "langfuse"]

[[rules]]
id = "langfuse-secret-key"
description = "Langfuse Secret API Key"
regex = '''sk-lf-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
tags = ["api-key", "langfuse"]

[[rules.allowlists]]
description = "Redacted placeholders are safe"
regexes = [
  '''pk-lf-REDACTED''',
  '''sk-lf-REDACTED''',
  '''pk-lf-PUBLIC''',
  '''sk-lf-SECRET''',
  '''pk-lf-YOUR_PUBLIC_KEY''',
  '''sk-lf-YOUR_SECRET_KEY''',
]
